<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="hero">
            <h1>zomato</h1>
            <p>Discover the best food & drinks in Chennai</p>
            <div class="search-bar">
                <input type="text" placeholder="Search for restaurants, cuisine, or a dish">
                <button>Search</button>
            </div>
            <div class="auth-buttons">
                <button class="login">Login</button>
                <button class="signup">Signup</button>
            </div>
        </div>
    </header>

    <section class="categories">
        <div class="category">
            <img src="https://b.zmtcdn.com/webFrontend/e5b8785c257af2a7f354f1addaf37e4e1647364814.jpeg?output-format=webp&fit=around|402:360&crop=402:360;*,*"alt="Order Food Online">
            <p>Order Food Online</p>
        </div>
        <div class="category">
            <img src="https://b.zmtcdn.com/webFrontend/d026b357feb0d63c997549f6398da8cc1647364915.jpeg?output-format=webp&fit=around|402:360&crop=402:360;*,*" alt="Go out for a meal">
            <p>Go out for a meal</p>
        </div>
        <div class="category">
            <img src="https://b.zmtcdn.com/data/o2_assets/371de657644f1b5818fcb5d83387c8c91722851940.png?output-format=webp&fit=around|402:360&crop=402:360;*,*" alt="Nightlife & Clubs">
            <p>Nightlife & Clubs</p>
        </div>
        <div class="category">
            <img src="https://up.yimg.com/ib/th?id=OIP.ZX2zmEzpDnsJq17slR10XgHaE8&pid=Api&rs=1&c=1&qlt=95&w=159&h=106" alt="Zomato Pro">
            <p>Zomato Pro</p>
        </div>
    </section>
</body>
</html>
